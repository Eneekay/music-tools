<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drum Machine — Music Tools</title>
<meta name="description" content="A programmable 808-style drum machine: step sequencer with 8/16/32-step patterns, multiple simultaneous tracks, mute/solo, and genre presets for house, techno, hip-hop, trap, rock, funk, reggae and disco.">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="../css/site.css?v=1" rel="stylesheet">
<link href="css/drums.css?v=1" rel="stylesheet">
</head>
<body>

  <svg class="contour-group contour-group--a" viewBox="0 0 2880 64" preserveAspectRatio="none">
    <path class="contour-line" d="M0,14 C240,23 480,5 720,14 C960,23 1200,5 1440,14 C1680,23 1920,5 2160,14 C2400,23 2640,5 2880,14"></path>
    <path class="contour-line" d="M0,23 C240,32 480,14 720,23 C960,32 1200,14 1440,23 C1680,32 1920,14 2160,23 C2400,32 2640,14 2880,23"></path>
    <path class="contour-line" d="M0,32 C240,41 480,23 720,32 C960,41 1200,23 1440,32 C1680,41 1920,23 2160,32 C2400,41 2640,23 2880,32"></path>
    <path class="contour-line" d="M0,41 C240,50 480,32 720,41 C960,50 1200,32 1440,41 C1680,50 1920,32 2160,41 C2400,50 2640,32 2880,41"></path>
    <path class="contour-line" d="M0,50 C240,59 480,41 720,50 C960,59 1200,41 1440,50 C1680,59 1920,41 2160,50 C2400,59 2640,41 2880,50"></path>
  </svg>
  <svg class="contour-group contour-group--b" viewBox="0 0 2880 64" preserveAspectRatio="none">
    <path class="contour-line" d="M0,14 C240,8 480,20 720,14 C960,8 1200,20 1440,14 C1680,8 1920,20 2160,14 C2400,8 2640,20 2880,14"></path>
    <path class="contour-line" d="M0,23 C240,17 480,29 720,23 C960,17 1200,29 1440,23 C1680,17 1920,29 2160,23 C2400,17 2640,29 2880,23"></path>
    <path class="contour-line" d="M0,32 C240,26 480,38 720,32 C960,26 1200,38 1440,32 C1680,26 1920,38 2160,32 C2400,26 2640,38 2880,32"></path>
    <path class="contour-line" d="M0,41 C240,35 480,47 720,41 C960,35 1200,47 1440,41 C1680,35 1920,47 2160,41 C2400,35 2640,47 2880,41"></path>
    <path class="contour-line" d="M0,50 C240,44 480,56 720,50 C960,44 1200,56 1440,50 C1680,44 1920,56 2160,50 C2400,44 2640,56 2880,50"></path>
  </svg>
  <svg class="contour-group contour-group--c" viewBox="0 0 2880 64" preserveAspectRatio="none">
    <path class="contour-line" d="M0,14 C240,26 480,2 720,14 C960,26 1200,2 1440,14 C1680,26 1920,2 2160,14 C2400,26 2640,2 2880,14"></path>
    <path class="contour-line" d="M0,23 C240,35 480,11 720,23 C960,35 1200,11 1440,23 C1680,35 1920,11 2160,23 C2400,35 2640,11 2880,23"></path>
    <path class="contour-line" d="M0,32 C240,44 480,20 720,32 C960,44 1200,20 1440,32 C1680,44 1920,20 2160,32 C2400,44 2640,20 2880,32"></path>
    <path class="contour-line" d="M0,41 C240,53 480,29 720,41 C960,53 1200,29 1440,41 C1680,53 1920,29 2160,41 C2400,53 2640,29 2880,41"></path>
    <path class="contour-line" d="M0,50 C240,62 480,38 720,50 C960,62 1200,38 1440,50 C1680,62 1920,38 2160,50 C2400,62 2640,38 2880,50"></path>
  </svg>
</div>
<canvas id="notes-canvas" aria-hidden="true"></canvas>
<div class="dot-grid" aria-hidden="true"></div>
<div class="blob blob-1" aria-hidden="true"></div>
<div class="blob blob-2" aria-hidden="true"></div>
<div class="blob blob-3" aria-hidden="true"></div>

<div class="dashboard">

  <header class="app-header">
    <a class="back-link" href="../">&larr; Music Tools</a>
    <h1 class="app-title">Drum Machine</h1>
    <p class="app-sub">A programmable 808-style step sequencer &mdash; multiple tracks, up to 32 steps, and genre presets to start from.</p>
  </header>

  <section class="widget transport-widget glass">
    <span class="widget-eyebrow">Transport</span>
    <div class="transport-row">
      <button type="button" class="transport-play-btn" id="playBtn">
        <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5-11-6.5z"></path></svg>
        <svg class="icon-stop" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1.5"></rect></svg>
        <span id="playBtnLabel">Play</span>
      </button>

      <div class="control-group">
        <span class="seg-label">Steps</span>
        <div class="seg-control" id="stepsControl">
          <button type="button" data-value="8">8</button>
          <button type="button" data-value="16" class="is-active">16</button>
          <button type="button" data-value="32">32</button>
        </div>
      </div>

      <div class="control-group control-group--bpm">
        <span class="seg-label">Tempo</span>
        <div class="bpm-control">
          <button type="button" class="bpm-step" id="bpmDown" aria-label="Decrease tempo">&minus;</button>
          <input type="number" id="bpmInput" min="40" max="220" value="124" inputmode="numeric">
          <span class="bpm-unit">BPM</span>
          <button type="button" class="bpm-step" id="bpmUp" aria-label="Increase tempo">+</button>
        </div>
        <input type="range" id="bpmSlider" min="40" max="220" value="124" class="bpm-slider">
      </div>

      <div class="control-group">
        <span class="seg-label">Volume</span>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.85" class="volume-slider">
      </div>

      <div class="control-group">
        <span class="seg-label">Pattern</span>
        <div class="action-btns">
          <button type="button" class="ghost-btn" id="randomizeBtn">Randomize</button>
          <button type="button" class="ghost-btn" id="clearBtn">Clear</button>
        </div>
      </div>
    </div>
  </section>

  <div class="dash-columns">

    <div class="dash-col">
      <section class="widget presets-widget widget--filler glass">
        <span class="widget-eyebrow">Presets</span>
        <div class="preset-list" id="presetList"></div>
      </section>
    </div>

    <div class="dash-col">
      <section class="widget about-widget widget--filler glass">
        <span class="widget-eyebrow">About This Pattern</span>
        <h3 class="pattern-name" id="patternName">&mdash;</h3>
        <p class="pattern-desc" id="patternDesc"></p>
        <div class="pattern-meta" id="patternMeta"></div>
      </section>
    </div>

  </div>

  <section class="widget sequencer-widget glass">
    <span class="widget-eyebrow">Sequencer</span>
    <div class="sequencer-scroll">
      <div class="sequencer-grid" id="sequencerGrid"></div>
    </div>
  </section>

</div>

<div class="kbd-hint" id="kbdHint" aria-hidden="true">
  <div class="kbd-hint-inner">
    <div class="kbd-hint-row"><kbd class="kbd-hint-key kbd-hint-key--wide">Space</kbd><span class="kbd-hint-text">Play / Stop</span></div>
    <div class="kbd-hint-row"><kbd class="kbd-hint-key">C</kbd><span class="kbd-hint-text">Clear</span></div>
    <div class="kbd-hint-row"><kbd class="kbd-hint-key">R</kbd><span class="kbd-hint-text">Randomize</span></div>
    <div class="kbd-hint-row"><span class="kbd-hint-combo"><kbd class="kbd-hint-key">1</kbd><span class="kbd-hint-dash">&ndash;</span><kbd class="kbd-hint-key">3</kbd></span><span class="kbd-hint-text">8 / 16 / 32 steps</span></div>
  </div>
</div>

<script src="../js/background.js?v=1"></script>
<script src="js/drums.js?v=1"></script>
</body>
</html>
