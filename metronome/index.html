<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metronome — Music Tools</title>
<meta name="description" content="A traditional-style metronome with numeric counting, custom rhythms, polyrhythms and switchable click sounds.">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="../css/site.css?v=1" rel="stylesheet">
<link href="css/metronome.css?v=1" rel="stylesheet">
</head>
<body>

<div class="splash-overlay" id="splashOverlay">
  <div class="splash-stripes" id="splashStripes"></div>
  <div class="splash-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8.5 20h7l-2-14.5a1 1 0 0 0-1-.9h-1a1 1 0 0 0-1 .9L8.5 20z"></path>
      <path d="M7 15.5h10"></path>
      <line x1="12" y1="18" x2="14.8" y2="6.4"></line>
    </svg>
  </div>
</div>

<div class="contour-bg" aria-hidden="true">
  <!-- Each group is one <svg>, so its 5 lines share a single transform and can
       never drift out of lockstep. Every path in a group is the same waveform
       shifted by a constant baseline offset, so the vertical gap between any
       two lines stays fixed everywhere along x - they can never cross. -->
  <svg class="contour-group contour-group--a" viewBox="0 0 2880 64" preserveAspectRatio="none">
    <path class="contour-line" d="M0,14 C240,23 480,5 720,14 C960,23 1200,5 1440,14 C1680,23 1920,5 2160,14 C2400,23 2640,5 2880,14"></path>
    <path class="contour-line" d="M0,23 C240,32 480,14 720,23 C960,32 1200,14 1440,23 C1680,32 1920,14 2160,23 C2400,32 2640,14 2880,23"></path>
    <path class="contour-line" d="M0,32 C240,41 480,23 720,32 C960,41 1200,23 1440,32 C1680,41 1920,23 2160,32 C2400,41 2640,23 2880,32"></path>
    <path class="contour-line" d="M0,41 C240,50 480,32 720,41 C960,50 1200,32 1440,41 C1680,50 1920,32 2160,41 C2400,50 2640,32 2880,41"></path>
    <path class="contour-line" d="M0,50 C240,59 480,41 720,50 C960,59 1200,41 1440,50 C1680,59 1920,41 2160,50 C2400,59 2640,41 2880,50"></path>
  </svg>
  <svg class="contour-group contour-group--b" viewBox="0 0 2880 64" preserveAspectRatio="none">
    <path class="contour-line" d="M0,14 C240,8 480,20 720,14 C960,8 1200,20 1440,14 C1680,8 1920,20 2160,14 C2400,8 2640,20 2880,14"></path>
    <path class="contour-line" d="M0,23 C240,17 480,29 720,23 C960,17 1200,29 1440,23 C1680,17 1920,29 2160,23 C2400,17 2640,29 2880,23"></path>
    <path class="contour-line" d="M0,32 C240,26 480,38 720,32 C960,26 1200,38 1440,32 C1680,26 1920,38 2160,32 C2400,26 2640,38 2880,32"></path>
    <path class="contour-line" d="M0,41 C240,35 480,47 720,41 C960,35 1200,47 1440,41 C1680,35 1920,47 2160,41 C2400,35 2640,47 2880,41"></path>
    <path class="contour-line" d="M0,50 C240,44 480,56 720,50 C960,44 1200,56 1440,50 C1680,44 1920,56 2160,50 C2400,44 2640,56 2880,50"></path>
  </svg>
  <svg class="contour-group contour-group--c" viewBox="0 0 2880 64" preserveAspectRatio="none">
    <path class="contour-line" d="M0,14 C240,26 480,2 720,14 C960,26 1200,2 1440,14 C1680,26 1920,2 2160,14 C2400,26 2640,2 2880,14"></path>
    <path class="contour-line" d="M0,23 C240,35 480,11 720,23 C960,35 1200,11 1440,23 C1680,35 1920,11 2160,23 C2400,35 2640,11 2880,23"></path>
    <path class="contour-line" d="M0,32 C240,44 480,20 720,32 C960,44 1200,20 1440,32 C1680,44 1920,20 2160,32 C2400,44 2640,20 2880,32"></path>
    <path class="contour-line" d="M0,41 C240,53 480,29 720,41 C960,53 1200,29 1440,41 C1680,53 1920,29 2160,41 C2400,53 2640,29 2880,41"></path>
    <path class="contour-line" d="M0,50 C240,62 480,38 720,50 C960,62 1200,38 1440,50 C1680,62 1920,38 2160,50 C2400,62 2640,38 2880,50"></path>
  </svg>
</div>
<canvas id="notes-canvas" aria-hidden="true"></canvas>
<div class="dot-grid" aria-hidden="true"></div>
<div class="blob blob-1" aria-hidden="true"></div>
<div class="blob blob-2" aria-hidden="true"></div>
<div class="blob blob-3" aria-hidden="true"></div>

<div class="dashboard" id="dashboard">

  <header class="app-header">
    <a class="back-link" href="../">&larr; Music Tools</a>
    <h1 class="app-title">Metronome</h1>
    <p class="app-sub">Pendulum &amp; numeric click, custom rhythms, polyrhythms, switchable sounds</p>
  </header>

  <div class="dash-columns">

    <div class="dash-col">
      <section class="widget metro-widget widget--filler glass">
        <div class="metro-stage">
          <div class="metro-body">
            <div class="metro-scale">
              <span class="metro-tick" style="--tick-angle:-25deg"></span>
              <span class="metro-tick" style="--tick-angle:-12.5deg"></span>
              <span class="metro-tick metro-tick--center" style="--tick-angle:0deg"></span>
              <span class="metro-tick" style="--tick-angle:12.5deg"></span>
              <span class="metro-tick" style="--tick-angle:25deg"></span>
            </div>
            <div class="metro-needle" id="metroNeedle">
              <div class="metro-weight" id="metroWeight"></div>
            </div>
            <div class="metro-pivot"></div>
          </div>
        </div>

        <div class="metro-transport">
          <button type="button" class="metro-play" id="playBtn" aria-label="Start metronome" aria-pressed="false">
            <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5-11-6.5z"></path></svg>
            <svg class="icon-stop" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>
          </button>
          <button type="button" class="metro-tap" id="tapBtn">Tap</button>
        </div>

        <div class="bpm-block">
          <div class="bpm-row">
            <button type="button" class="bpm-step" id="bpmDown" aria-label="Decrease tempo">–</button>
            <div class="bpm-readout">
              <input type="number" id="bpmInput" class="bpm-input" min="20" max="300" step="1" value="120" inputmode="numeric" aria-label="Beats per minute">
              <span class="bpm-unit">BPM</span>
            </div>
            <button type="button" class="bpm-step" id="bpmUp" aria-label="Increase tempo">+</button>
          </div>
          <input type="range" id="bpmSlider" class="bpm-slider" min="20" max="300" step="1" value="120" aria-label="Tempo slider">
        </div>
      </section>
    </div>

    <div class="dash-col">
      <section class="widget counter-widget widget--filler glass">
        <span class="widget-eyebrow">Beat</span>
        <div class="beat-dots" id="beatDots"></div>
        <div class="beat-number" id="beatNumber">–</div>
        <div class="beat-meta" id="beatMeta">Ready</div>
      </section>

      <section class="widget rhythm-widget glass">
        <span class="widget-eyebrow">Rhythm</span>
        <div class="rhythm-presets" id="rhythmPresets"></div>
        <div class="rhythm-custom">
          <label class="rhythm-field">
            <span>Beats</span>
            <input type="number" id="numeratorInput" min="1" max="16" value="4" inputmode="numeric">
          </label>
          <span class="rhythm-slash">/</span>
          <label class="rhythm-field">
            <span>Note</span>
            <select id="denominatorInput">
              <option value="2">2</option>
              <option value="4" selected>4</option>
              <option value="8">8</option>
              <option value="16">16</option>
            </select>
          </label>
        </div>
        <div class="rhythm-sub-row">
          <span class="seg-label">Subdivide</span>
          <div class="seg-control" id="subdivisionControl">
            <button type="button" data-value="1" class="is-active">Off</button>
            <button type="button" data-value="2">2</button>
            <button type="button" data-value="3">3</button>
            <button type="button" data-value="4">4</button>
          </div>
        </div>
      </section>
    </div>

    <div class="dash-col">
      <section class="widget length-widget glass">
        <span class="widget-eyebrow">Length</span>
        <div class="length-row">
          <span class="seg-label">Count</span>
          <div class="seg-control" id="lengthControl">
            <button type="button" data-value="infinite" class="is-active">∞</button>
            <button type="button" data-value="bars">Bars</button>
          </div>
          <input type="number" id="barsInput" class="bars-input" min="1" max="999" value="8" disabled aria-label="Number of bars">
        </div>
        <div class="length-row">
          <span class="seg-label">Count-in</span>
          <div class="seg-control" id="precountControl">
            <button type="button" data-value="0" class="is-active">Off</button>
            <button type="button" data-value="1">1 bar</button>
            <button type="button" data-value="2">2 bars</button>
          </div>
        </div>
      </section>

      <section class="widget poly-widget widget--filler glass">
        <div class="poly-header">
          <span class="widget-eyebrow">Polyrhythm</span>
          <label class="switch">
            <input type="checkbox" id="polyToggle">
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </label>
        </div>
        <div class="poly-ratio">
          <input type="number" id="polyAInput" min="2" max="16" value="3" disabled aria-label="Polyrhythm layer A beats">
          <span class="poly-colon">:</span>
          <input type="number" id="polyBInput" min="2" max="16" value="4" disabled aria-label="Polyrhythm layer B beats">
        </div>
        <div class="poly-viz" id="polyViz">
          <div class="poly-row" id="polyRowA" data-label="A"></div>
          <div class="poly-row" id="polyRowB" data-label="B"></div>
        </div>
      </section>

      <section class="widget sounds-widget glass">
        <span class="widget-eyebrow">Sounds</span>
        <div class="sound-kit" id="soundKit"></div>
        <div class="sound-assign" id="soundAssign"></div>
        <div class="volume-row">
          <span>Volume</span>
          <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8" aria-label="Master volume">
        </div>
      </section>
    </div>

  </div>

</div>

<div class="kbd-hint" id="kbdHint" aria-hidden="true">
  <div class="kbd-hint-inner">
    <div class="kbd-hint-row"><kbd class="kbd-hint-key kbd-hint-key--wide">Space</kbd><span class="kbd-hint-text">Play / Stop</span></div>
    <div class="kbd-hint-row"><span class="kbd-hint-combo"><kbd class="kbd-hint-key">&uarr;</kbd><kbd class="kbd-hint-key">&darr;</kbd></span><span class="kbd-hint-text">Tempo</span></div>
    <div class="kbd-hint-row"><span class="kbd-hint-combo"><kbd class="kbd-hint-key">1</kbd><span class="kbd-hint-dash">&ndash;</span><kbd class="kbd-hint-key">9</kbd></span><span class="kbd-hint-text">Beats per bar</span></div>
    <div class="kbd-hint-row"><kbd class="kbd-hint-key">T</kbd><span class="kbd-hint-text">Tap tempo</span></div>
  </div>
</div>

<script src="../js/background.js?v=1"></script>
<script src="../js/splash.js?v=1"></script>
<script src="js/metronome.js?v=1"></script>
</body>
</html>
